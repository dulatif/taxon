[package]
name = "taxon-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight CLI companion for Taxon agent tasks"

[[bin]]
name = "taxon-cli"
path = "src/main.rs"

[dependencies]
taxon-core = { path = "../taxon-core" }
clap = { version = "4.4", features = ["derive"] }
comfy-table = "7.1"
colored = "2.1"
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
