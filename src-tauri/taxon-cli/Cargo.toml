[package]
name = "taxon-cli"
version = "0.1.0"
edition = "2021"
description = "Lightweight CLI companion and interactive TUI for Taxon"

[lib]
name = "taxon_cli"
path = "src/lib.rs"

[[bin]]
name = "taxon"
path = "src/main.rs"

[[bin]]
name = "taxon-cli"
path = "src/bin/taxon-cli.rs"

[dependencies]
taxon-core = { path = "../taxon-core" }
clap = { version = "4.4", features = ["derive"] }
comfy-table = "7.1"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
ratatui = "0.29"
crossterm = "0.28"
is-terminal = "0.4"
